{% extends 'eatifybase.html' %}

{% block title %}Order Success | Eatify{% endblock %}

{% block content %}
<div class="text-center mt-5">
    <h2 class="text-success">🎉 Order Placed Successfully!</h2>
    <p class="mt-3">
        Thank you for ordering with <strong>Eatify</strong>.
        Your delicious food is on its way!
    </p>

    <p class="text-muted mt-2">
        Redirecting to your orders in <span id="countdown">3</span> seconds…
    </p>

    <a href="{% url 'order_history' %}" class="btn btn-success mt-3">
        View My Orders
    </a>

    <a href="{% url 'eatify_home' %}" class="btn btn-outline-primary mt-3 ms-2">
        Back to Home
    </a>
</div>

<script>
    let seconds = 3;
    const countdown = document.getElementById("countdown");

    const timer = setInterval(() => {
        seconds--;
        countdown.innerText = seconds;

        if (seconds === 0) {
            clearInterval(timer);
            window.location.href = "{% url 'order_history' %}";
        }
    }, 1000);
</script>
{% endblock %}
