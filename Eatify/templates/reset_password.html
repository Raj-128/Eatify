{% extends "eatifybase.html" %}
{% block title %}Reset Password | Eatify{% endblock %}

{% block content %}
<style>
    body {
        background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') no-repeat center center fixed;
        background-size: cover;
    }
    .glass-box {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 40px;
        color: #fff;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .form-control {
        background-color: rgba(255,255,255,0.2);
        border: none;
        color: #fff;
    }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="col-11 col-sm-10 col-md-6 col-lg-5 glass-box">
        <h3 class="mb-4 text-center">🔑 Reset Your Password</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="d-grid mt-4">
                <button class="btn btn-success">Update Password</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
