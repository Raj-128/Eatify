{% extends "eatifybase.html" %}
{% block title %}Forgot Password | Eatify{% endblock %}

{% block content %}
<style>
    body {
        background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') no-repeat center center fixed;
        background-size: cover;
    }
    .glass-box {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        color: #fff;
    }
    .form-control {
        background-color: rgba(255,255,255,0.2);
        border: none;
        color: #fff;
    }
    .form-control::placeholder {
        color: #ddd;
    }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="col-11 col-sm-10 col-md-6 col-lg-5 glass-box">
        <h3 class="mb-4 text-center">🔐 Forgot Password</h3>

        <p class="text-center">Enter your email and we'll send you a reset link.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.email }}

            <div class="d-grid mt-4">
                <button class="btn btn-info">Send Reset Link</button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <a href="{% url 'eatify_login' %}" style="color: #00e1ff;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
