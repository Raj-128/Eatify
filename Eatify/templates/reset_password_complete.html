{% extends "eatifybase.html" %}
{% block title %}Password Reset Complete | Eatify{% endblock %}

{% block content %}
<style>
    body {
        background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') no-repeat center center fixed;
        background-size: cover;
    }
    .glass-box {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 40px;
        color: #fff;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="col-11 col-sm-10 col-md-6 col-lg-5 glass-box">
        <h3 class="text-center mb-3">🎉 Password Changed Successfully!</h3>
        <p class="text-center">You can now log in with your new password.</p>

        <div class="text-center mt-4">
            <a class="btn btn-primary" href="{% url 'eatify_login' %}">Login</a>
        </div>
    </div>
</div>
{% endblock %}
